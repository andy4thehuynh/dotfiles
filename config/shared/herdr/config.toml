# tmux-inspired, minimal (herdr + omarchy defaults otherwise)
# tmux session -> herdr workspace, window -> tab, pane -> pane

[keys]
prefix = "ctrl+a"

# Tabs (tmux: h/l = prev/next window)
previous_tab = "prefix+h"
next_tab = "prefix+l"

# Sidebar (tmux: no equivalent; herdr default is prefix+b)
toggle_sidebar = "prefix+quote"

# Splits (tmux: | vertical, - horizontal)
split_vertical = "prefix+shift+backslash"
split_horizontal = "prefix+minus"

# Resize (herdr default resize_mode is prefix+r, taken here by nothing; tmux muscle memory)
resize_mode = "prefix+ctrl+r"

# Reload config
reload_config = "prefix+shift+p"

# Rename
rename_tab = "prefix+r"
rename_workspace = "prefix+shift+r"
# herdr default rename_pane is prefix+shift+p, taken by reload_config
rename_pane = "prefix+p"

# tmux: new-session
new_workspace = "prefix+shift+c"
next_workspace = "prefix+n"
previous_workspace = "prefix+shift+n"

# Panes (tmux: C-h/j/k/l prefix-free via vim-tmux-navigator)
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

[ui]
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"
