set -g default-terminal 'tmux-256color'

# Raspberry Pi needs the older Tc capability instead of RGB to get btop's colors right
if-shell "[ $(uname -s) = 'Linux' ] && grep -q 'Raspberry Pi' /proc/cpuinfo" {
    set -ga terminal-overrides ',*256col*:Tc'
} {
    set -ag terminal-overrides ',*:RGB'
}

set -g mouse on

# Login shells source ~/.bash_profile, which pulls in ~/.bashrc and with it mise.
# $SHELL keeps this working on both macOS (Homebrew bash) and Linux.
set -g default-shell "$SHELL"

# Ctrl-b sucks. lets bind ctrl-a instead
unbind C-b
set -g prefix C-a

bind-key l next-window
bind-key h previous-window

# Rebinding the pane splitting bindings
unbind % # Remove default bindings since we're replacing
bind | split-window -h
bind - split-window -v

# Smart pane switching with awareness of vim splits
# source: https://github.com/christoomey/vim-tmux-navigator
# Inspecting the pane's tty beats pane_current_command, which reports the
# subprocess name once nvim shells out and misses the running editor.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# C-l no longer reaches the shell, so put clear-screen back behind the prefix
bind C-l send-keys 'C-l'

# Windows and panes both count from 1, and closing one renumbers the rest
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Jump straight to a window without the prefix
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# resize pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reloading
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Vi keys in copy mode, selecting and yanking the way nvim does
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Responsiveness and passthrough
set -sg escape-time 10
set -g focus-events on
set -g allow-passthrough on
set -g set-clipboard on
set -as terminal-features ',*:clipboard'
setw -g aggressive-resize on
set -g history-limit 50000

# Status Bar
# bg=default lets the terminal theme show through instead of hardcoding black
set-option -g status on
set -g status-position top
set -g status-style 'bg=default,fg=default'
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
set -g status-right "#[fg=blue]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=blue'
set -g message-style 'bg=default,fg=blue'
set -g mode-style 'bg=blue,fg=black'
